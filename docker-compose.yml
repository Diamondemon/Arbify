version: '3.7'

services:
    arbify:
        build:
            args:
                user: arbify
                uid: 1000
            context: .
            dockerfile: docker/arbify/Dockerfile
        image: arbify
        restart: unless-stopped
        working_dir: /var/www
        environment:
            DB_CONNECTION: mysql
            DB_HOST: localhost
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-arbify}
            DB_USERNAME: ${DB_USERNAME:-root}
            DB_PASSWORD: ${DB_PASSWORD}
        ports:
            - 8080:80
        volumes:
            - db-data:/var/lib/mysql
            - .:/var/www

volumes:
    db-data:
