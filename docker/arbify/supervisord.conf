[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mariadb]
command=/usr/sbin/mysqld --user=mysql --console --skip-name-resolve
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/mariadb.log
stderr_logfile=/var/log/supervisor/mariadb_err.log
priority=1
stopwaitsecs=10
stopsignal=TERM
killasgroup=true
stopasgroup=true

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm_err.log
priority=2
stopwaitsecs=10
stopsignal=QUIT
killasgroup=true
stopasgroup=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log
priority=3
stopwaitsecs=5
stopsignal=QUIT
killasgroup=true
stopasgroup=true

[program:migrate]
command=/bin/bash -c "sleep 5 && cd /var/www && php artisan migrate --force"
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/var/log/supervisor/migrate.log
stderr_logfile=/var/log/supervisor/migrate_err.log
priority=4
